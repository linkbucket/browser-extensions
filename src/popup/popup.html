<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linkbucket</title>

    <!-- Tom Select styles (local copy; no remote CDNs in MV3) -->
    <link rel="stylesheet" href="/vendor/tom-select/tom-select.min.css" />

    <!-- Existing popup styles -->
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1 class="brand">
      <img src="/assets/images/bucket-mark.svg" alt="" class="brand__mark" />
      <img
        src="/assets/images/lb-logo.svg"
        alt="Save to Linkbucket"
        class="brand__wordmark"
      />
    </h1>

    <!-- Key entry form -->
    <form id="key-form" style="display: none">
      <label for="accessKeyId">Access Key ID</label>
      <input
        type="text"
        id="accessKeyId"
        name="accessKeyId"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        autocomplete="off"
        inputmode="none"
        required
      />
      <label for="secretKey">Secret Key</label>
      <input
        type="password"
        id="secretKey"
        name="secretKey"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        autocomplete="off"
        inputmode="none"
        required
      />
      <div class="actions">
        <button type="submit">Save keys</button>
      </div>
    </form>

    <!-- URL save form -->
    <form id="url-form" style="display: none">
      <div class="saved-status" id="savedStatus" style="display: none">
        <span class="saved-status__check">✓</span>
        <span class="saved-status__text" id="savedStatusText"></span>
      </div>

      <div class="pageinfo">
        <div class="pageinfo__title" id="pageTitle"></div>
        <div class="pageinfo__url" id="pageUrl"></div>
      </div>

      <!-- Placement cards: My Links plus one card per folder -->
      <section class="placement-card" id="my-links-card">
        <div class="placement-card__header">
          <span class="placement-card__name">My Links</span>
          <span class="placement-card__meta" id="myLinksMeta">private</span>
          <input
            type="checkbox"
            id="myLinksCheck"
            class="placement-card__check"
            title="Save to My Links"
            checked
          />
        </div>
        <select
          id="tags"
          name="tags[]"
          multiple
          placeholder="Add tags…"
          autocomplete="off"
        ></select>
      </section>

      <div id="folder-cards"></div>

      <template id="folder-card-template">
        <section class="placement-card placement-card--folder">
          <div class="placement-card__header">
            <span class="placement-pill placement-pill--folder"></span>
            <span class="placement-card__meta"></span>
            <button
              type="button"
              class="placement-card__remove"
              title="Remove from this folder"
            >
              ✕
            </button>
          </div>
          <select multiple placeholder="Add tags…" autocomplete="off"></select>
        </section>
      </template>

      <div id="add-folder-row">
        <button type="button" id="addFolder">+ Add to folder</button>
        <select id="folderPicker" style="display: none"></select>
      </div>

      <div class="actions">
        <button id="resetKeys" type="button">Change API Keys</button>
        <button id="saveButton" type="submit">Save</button>
      </div>
    </form>

    <div id="result" class="small"></div>

    <!-- Alias chrome.* to browser.* on Chromium (Firefox exposes browser natively) -->
    <script src="browser-shim.js"></script>

    <!-- Tom Select library (local UMD build) -->
    <script src="/vendor/tom-select/tom-select.complete.min.js"></script>

    <!-- App logic -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
