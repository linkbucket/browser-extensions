<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linkbucket</title>

    <!-- Tom Select styles (local copy; no remote CDNs in MV3) -->
    <link rel="stylesheet" href="/vendor/tom-select/tom-select.min.css" />

    <!-- Existing popup styles -->
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <img src="/assets/images/skate-bucky.svg" alt="" />
    <h1>
      <img
        src="/assets/images/lb-logo.svg"
        alt="Save to Linkbucket"
        class="wordmark"
      />
    </h1>

    <!-- Key entry form -->
    <form id="key-form" style="display: none">
      <label for="accessKeyId">Access Key ID</label>
      <input
        type="text"
        id="accessKeyId"
        name="accessKeyId"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        autocomplete="off"
        inputmode="none"
        required
      />
      <label for="secretKey">Secret Key</label>
      <input
        type="password"
        id="secretKey"
        name="secretKey"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        autocomplete="off"
        inputmode="none"
        required
      />
      <div class="actions">
        <button type="submit">Save keys</button>
      </div>
    </form>

    <!-- URL save form -->
    <form id="url-form" style="display: none">
      <label for="url">URL</label>
      <input
        type="url"
        name="url"
        id="url"
        pattern="https://.*"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        readonly
        required
      />

      <!-- Step 1: where the link goes. My Links is always saved; each
           checked folder gets its own tag row below. -->
      <label class="step-label">1 · Where does it go?</label>
      <div id="destinations">
        <label class="destination">
          <input type="checkbox" checked disabled />
          <span class="destination__name">My Links</span>
          <span class="destination__meta">private · always saved</span>
        </label>
        <div id="folder-list"></div>
        <input
          type="search"
          id="folderSearch"
          placeholder="Search folders…"
          autocomplete="off"
          style="display: none"
        />
      </div>

      <template id="destination-template">
        <label class="destination">
          <input type="checkbox" />
          <span class="destination__name"></span>
          <span class="destination__meta"></span>
        </label>
      </template>

      <!-- Step 2: one tag row per destination, each scoped to its folder -->
      <label class="step-label">
        2 · Tags <span class="step-label__note">per folder, kept separate</span>
      </label>
      <div class="tag-row">
        <span class="tag-row__label">My Links</span>
        <select
          id="tags"
          name="tags[]"
          multiple
          placeholder="Add tags…"
          autocomplete="off"
        ></select>
      </div>
      <div id="folder-tag-rows"></div>

      <template id="tag-row-template">
        <div class="tag-row">
          <span class="tag-row__label"></span>
          <select multiple placeholder="Add tags…" autocomplete="off"></select>
        </div>
      </template>

      <div class="actions">
        <button id="resetKeys" type="button">Change API Keys</button>
        <button type="submit">Save link</button>
      </div>
    </form>

    <div id="result" class="small"></div>

    <!-- Alias chrome.* to browser.* on Chromium (Firefox exposes browser natively) -->
    <script src="browser-shim.js"></script>

    <!-- Tom Select library (local UMD build) -->
    <script src="/vendor/tom-select/tom-select.complete.min.js"></script>

    <!-- App logic -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
